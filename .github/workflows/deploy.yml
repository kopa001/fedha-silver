name: Deploy Vite Static Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job: compile TypeScript and generate production static assets
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & Lint
        run: npm run lint

      - name: Build static production assets with Vite
        run: npm run build

      - name: Configure static SPA fallbacks for GitHub Pages
        run: |
          # Disable Jekyll processing on GitHub Pages to ensure all assets and underscore files are served
          touch dist/.nojekyll
          # Copy index.html to 404.html to support direct client-side routing on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job: publish static assets to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
